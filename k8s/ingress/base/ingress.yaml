apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatapp-ingress
  namespace: chatapp
  annotations:
    # Enable WebSocket support for MQTT
    nginx.ingress.kubernetes.io/websocket-services: "emqx-service"
    # Increase timeouts for long-lived MQTT connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Enable WebSocket upgrade
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
spec:
  ingressClassName: nginx
  rules:
  - host: chatapp.local
    http:
      paths:
      # API routes - /api/* goes to chatapp-api-service
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: chatapp-api-service
            port:
              number: 8080
      
      # EMQX Dashboard - /dashboard goes to EMQX dashboard
      - path: /dashboard
        pathType: Prefix
        backend:
          service:
            name: emqx-service
            port:
              number: 18083
      
      # EMQX WebSocket - /mqtt for MQTTX connections
      - path: /mqtt
        pathType: Prefix
        backend:
          service:
            name: emqx-service
            port:
              number: 8083
