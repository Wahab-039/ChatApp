apiVersion: v1
kind: Service
metadata:
  name: emqx-service
  namespace: chatapp
spec:
  selector:
    app: emqx
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
    protocol: TCP
  - name: ws
    port: 8083
    targetPort: 8083
    protocol: TCP
  - name: dashboard
    port: 18083
    targetPort: 18083
    protocol: TCP
  type: ClusterIP
