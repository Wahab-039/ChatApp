apiVersion: v1
kind: ConfigMap
metadata:
  name: chatapp-config
  namespace: chatapp
data:
  # Database Configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "chatapp"
  DB_SSLMODE: "disable"
  
  # EMQX Configuration
  EMQX_HOST: "emqx-service"
  EMQX_PORT: "1883"
  EMQX_WS_PORT: "8083"
  EMQX_DASHBOARD_PORT: "18083"
  EMQX_MQTT_TCP_URL: "tcp://emqx-service:1883"
  EMQX_CLIENT_ID: "chatapp-api"
  
  # API Configuration
  API_PORT: "8080"
  GIN_MODE: "release"
  
  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080"
