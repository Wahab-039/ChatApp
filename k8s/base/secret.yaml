apiVersion: v1
kind: Secret
metadata:
  name: chatapp-secret
  namespace: chatapp
type: Opaque
stringData:
  # Database Credentials (base64 encoded in production)
  DB_USER: "chatapp"
  DB_PASSWORD: "chatapp_password_123"
  
  # EMQX Credentials
  EMQX_SERVICE_USERNAME: "chatapp_service"
  EMQX_SERVICE_PASSWORD: "chatapp_mqtt_password"
  
  # JWT Secret (Change this in production!)
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
