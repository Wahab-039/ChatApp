apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp-api
  namespace: chatapp
  labels:
    app: chatapp-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatapp-api
  template:
    metadata:
      labels:
        app: chatapp-api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done']
      - name: wait-for-emqx
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z emqx-service 1883; do echo waiting for emqx; sleep 2; done']
      containers:
      - name: api
        image: chatapp-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        # Database Configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: chatapp-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatapp-secret
              key: DB_PASSWORD
        - name: DB_SSLMODE
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: DB_SSLMODE
        # EMQX Configuration
        - name: EMQX_HOST
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: EMQX_HOST
        - name: EMQX_PORT
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: EMQX_PORT
        - name: EMQX_MQTT_TCP_URL
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: EMQX_MQTT_TCP_URL
        - name: EMQX_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: EMQX_CLIENT_ID
        - name: EMQX_SERVICE_USERNAME
          valueFrom:
            secretKeyRef:
              name: chatapp-secret
              key: EMQX_SERVICE_USERNAME
        - name: EMQX_SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatapp-secret
              key: EMQX_SERVICE_PASSWORD
        # API Configuration
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: API_PORT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chatapp-secret
              key: JWT_SECRET
        - name: GIN_MODE
          valueFrom:
            configMapKeyRef:
              name: chatapp-config
              key: GIN_MODE
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
