services:
  postgres:
    image: postgres:16-alpine
    container_name: chatapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chatapp-network

  emqx:
    image: emqx/emqx:5.8.6
    container_name: chatapp-emqx
    restart: unless-stopped
    ports:
      - "1884:1883"       # MQTT TCP (Go publisher)
      - "8084:8083"       # MQTT over WebSocket
      - "18084:18083"     # Dashboard / management API
    env_file:
      - .env
    environment:
      EMQX_NAME: chatapp
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}

      # Auth chain: 1) service password account, 2) end-user JWT (password field = access token)
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: sha256
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__SALT_POSITION: suffix

      EMQX_AUTHENTICATION__2__MECHANISM: jwt
      EMQX_AUTHENTICATION__2__FROM: password
      EMQX_AUTHENTICATION__2__USE_JWKS: "false"
      EMQX_AUTHENTICATION__2__ALGORITHM: hmac-based
      EMQX_AUTHENTICATION__2__SECRET: ${JWT_SECRET}
      EMQX_AUTHENTICATION__2__SECRET_BASE64_ENCODED: "false"

      # Deny by default; rules come from the mounted ACL file.
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
    volumes:
      - ./deploy/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - chatapp-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override with Docker service names
      DB_HOST: postgres
      EMQX_MQTT_TCP_URL: tcp://emqx:1883
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chatapp-network

networks:
  chatapp-network:
    driver: bridge

volumes:
  postgres-data:
  emqx-data:
  emqx-log:
